<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>User Calendar</title>

    <!-- Core Bootstrap CSS/JS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

	<!-- jQuery CDN -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Our Custom CSS -->
	<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.min.css" rel="stylesheet">
	<link href="../css/home.css" rel="stylesheet" />
	<link href="../css/calendar.css" rel="stylesheet" />
	
	<!-- Custom JS -->
	<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.min.js"></script>
    <script src="../js/home.js"></script>
	<script src="../js/calendar.js"></script>

</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="border-end bg-white" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-light">
                <button class="btn btn-link p-0" id="sidebarToggle">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            <div class="list-group list-group-flush">
                <a href="home.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-tachometer-alt sidebar-icon"></i>
                    <span class="sidebar-text">Overview</span>
                </a>
                <a href="calendar.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="far fa-calendar-alt sidebar-icon"></i>
                    <span class="sidebar-text">Calendar</span>
                </a>
                <a href="courses.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-book sidebar-icon"></i>
                    <span class="sidebar-text">Courses</span>
                </a>
                <a href="messages.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="far fa-envelope sidebar-icon"></i>
                    <span class="sidebar-text">Messages</span>
                </a>
            </div>
            <div class="bottom-buttons">
                <a href="user.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-user sidebar-icon"></i>
                    <span class="sidebar-text">User</span>
                </a>
                <a href="settings.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-cog sidebar-icon"></i>
                    <span class="sidebar-text">Settings</span>
                </a>
				<a href="../index.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-arrow-right-from-bracket sidebar-icon"></i>
                    <span class="sidebar-text">Logout</span>
                </a>
            </div>
        </div>
		<!-- Page content wrapper-->
        <div id="page-content-wrapper">
			<div class="container-fluid">
                <div class="calendar-header mb-4">
                    <h2>Calendar</h2>
                    <div class="calendar-controls">
                        <div class="btn-group me-2">
                            <button class="btn btn-outline-primary" id="prevMonth">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <button class="btn btn-outline-primary" id="todayBtn">Today</button>
                            <button class="btn btn-outline-primary" id="nextMonth">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                        <div class="btn-group me-2">
                            <button class="btn btn-outline-primary" id="monthView">Month</button>
                            <button class="btn btn-outline-primary" id="weekView">Week</button>
                            <button class="btn btn-outline-primary" id="dayView">Day</button>
                        </div>
                        <button class="btn btn-outline-primary" id="addEventBtn">
                            <i class="fas fa-plus"></i> Add Event
                        </button>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-3">
                        <!-- Calendar Sidebar -->
                        <div class="calendar-sidebar">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">My Calendars</h5>
                                </div>
                                <div class="card-body">
                                    <div class="calendar-filters">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" checked id="personalCal">
                                            <label class="form-check-label" for="personalCal">
                                                Personal Events
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" checked id="courseCal">
                                            <label class="form-check-label" for="courseCal">
                                                Course Events
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" checked id="assignmentsCal">
                                            <label class="form-check-label" for="assignmentsCal">
                                                Assignments
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Upcoming Events Preview -->
                            <div class="card mt-3">
                                <div class="card-header">
                                    <h5 class="mb-0">Upcoming Events</h5>
                                </div>
                                <div class="card-body">
                                    <ul class="list-unstyled upcoming-events">
                                        <!-- Populated by JavaScript -->
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-9">
                        <!-- Calendar Container -->
                        <div class="calendar-container card">
                            <div class="card-body">
                                <div id="calendar"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
		</div>
	</div>
</body>
</html>
