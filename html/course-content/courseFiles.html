<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="View and manage course files" />
    <meta name="author" content="Course Management System" />
    <title>Course Files</title>

    <!-- Core Bootstrap CSS/JS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Our Custom CSS -->
    <link href="../../css/home.css" rel="stylesheet" />
    <link href="../../css/course-content.css" rel="stylesheet" />

    <!-- Custom JS -->
    <script src="../../js/home.js"></script>
</head>
<body class="course-content">
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="border-end bg-white" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-light">
                <button class="btn btn-link p-0" id="sidebarToggle">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            <div class="list-group list-group-flush">
                <a href="../home.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-tachometer-alt sidebar-icon"></i>
                    <span class="sidebar-text">Overview</span>
                </a>
                <a href="../calendar.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="far fa-calendar-alt sidebar-icon"></i>
                    <span class="sidebar-text">Calendar</span>
                </a>
                <a href="../courses.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-book sidebar-icon"></i>
                    <span class="sidebar-text">Courses</span>
                </a>
                <a href="../messages.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="far fa-envelope sidebar-icon"></i>
                    <span class="sidebar-text">Messages</span>
                </a>
            </div>
            <div class="bottom-buttons">
                <a href="../user.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-user sidebar-icon"></i>
                    <span class="sidebar-text">User</span>
                </a>
                <a href="../settings.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-cog sidebar-icon"></i>
                    <span class="sidebar-text">Settings</span>
                </a>
                <a href="../../index.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-arrow-right-from-bracket sidebar-icon"></i>
                    <span class="sidebar-text">Logout</span>
                </a>
            </div>
        </div>

        <!-- Page Content Wrapper -->
        <div id="page-content-wrapper">
            <div class="d-flex">
                <!-- Course Navigation -->
                <div class="course-nav">
                    <ul class="nav nav-pills flex-column">
                        <li class="nav-item">
                            <a href="courseHome.html" class="nav-link">
                                <i class="fs-4 bi-house"></i> <span>Home</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="courseAnnouncements.html" class="nav-link">
                                <i class="fs-4 bi-speedometer2"></i> <span>Announcements</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="courseAssignments.html" class="nav-link">
                                <i class="fs-4 bi-table"></i> <span>Assignments</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="courseGrades.html" class="nav-link">
                                <i class="fs-4 bi-bootstrap"></i> <span>Grades</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="courseDiscussions.html" class="nav-link">
                                <i class="fs-4 bi-grid"></i> <span>Discussions</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="coursePeople.html" class="nav-link">
                                <i class="fs-4 bi-people"></i> <span>People</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="courseFiles.html" class="nav-link active">
                                <i class="fs-4 bi-folder"></i> <span>Files</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <!-- Main Content Area -->
                <div class="course-content-container">
                    <h2>Course Files</h2>

                    <!-- File Upload Section -->
                    <div class="mb-4">
                        <label for="fileUpload" class="form-label">Upload Course Files</label>
                        <input class="form-control" type="file" id="fileUpload" multiple>
                        <button class="btn btn-primary mt-3" id="uploadButton">Upload Files</button>
                    </div>

                    <!-- Files Table -->
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped" id="filesTable">
                            <thead class="table-light">
                                <tr>
                                    <th>File Name</th>
                                    <th>File Size</th>
                                    <th>Date Uploaded</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Lecture 1.pdf</td>
                                    <td>1.2 MB</td>
                                    <td>October 10, 2024</td>
                                    <td>
                                        <button class="btn btn-danger btn-sm">Delete</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Assignment Instructions.docx</td>
                                    <td>500 KB</td>
                                    <td>October 11, 2024</td>
                                    <td>
                                        <button class="btn btn-danger btn-sm">Delete</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Link to courseFiles JS file -->
    <script src="../../js/courseFiles.js"></script>
</body>
</html>
