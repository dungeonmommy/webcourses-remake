<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Messages - UCF Webcourses 2.0</title>

    <!-- Core Bootstrap CSS/JS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Our Custom CSS -->
    <link href="../css/home.css" rel="stylesheet" />
    <link href="../css/messages.css" rel="stylesheet" />
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="border-end bg-white" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-light">
                <button class="btn btn-link p-0" id="sidebarToggle">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            <div class="list-group list-group-flush">
                <a href="home.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-tachometer-alt sidebar-icon"></i>
                    <span class="sidebar-text">Overview</span>
                </a>
                <a href="calendar.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="far fa-calendar-alt sidebar-icon"></i>
                    <span class="sidebar-text">Calendar</span>
                </a>
                <a href="courses.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-book sidebar-icon"></i>
                    <span class="sidebar-text">Courses</span>
                </a>
                <a href="messages.html" class="list-group-item list-group-item-action list-group-item-light p-3 active">
                    <i class="far fa-envelope sidebar-icon"></i>
                    <span class="sidebar-text">Messages</span>
                </a>
            </div>
            <div class="bottom-buttons">
                <a href="user.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-user sidebar-icon"></i>
                    <span class="sidebar-text">User</span>
                </a>
                <a href="settings.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-cog sidebar-icon"></i>
                    <span class="sidebar-text">Settings</span>
                </a>
                <a href="../index.html" class="list-group-item list-group-item-action list-group-item-light p-3">
                    <i class="fas fa-arrow-right-from-bracket sidebar-icon"></i>
                    <span class="sidebar-text">Logout</span>
                </a>
            </div>
        </div>

        <!-- Page content wrapper-->
        <div id="page-content-wrapper">
            <!-- Top navigation-->
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <h1 class="mt-4">Messages</h1>
                </div>
            </nav>

            <!-- Page content-->
            <div class="container-fluid">
                <div class="card shadow messages-container mt-4">
                    <div class="row g-0 h-100">
                        <!-- Contacts List -->
                        <div class="col-md-4 col-lg-3 border-end">
                            <div class="p-3">
                                <div class="filters mb-3">
                                    <select class="form-select mb-2" id="courseFilter">
                                        <option value="">All Courses</option>
                                        <option value="current">Current Courses</option>
                                        <option value="previous">Previous Courses</option>
                                    </select>
                                    <select class="form-select mb-2" id="specificCourseFilter" disabled>
                                        <option value="">Select Course</option>
                                        <!-- Populated by JavaScript -->
                                    </select>
                                    <select class="form-select mb-2" id="memberTypeFilter">
                                        <option value="">All Members</option>
                                        <option value="professor">Professors</option>
                                        <option value="student">Students</option>
                                        <option value="ta">Teaching Assistants</option>
                                    </select>
                                </div>
                                <div class="contacts">
                                    <!-- Contacts populated by JavaScript -->
                                </div>
                            </div>
                        </div>

                        <!-- Chat Area -->
                        <div class="col-md-8 col-lg-9">
                            <div class="d-flex flex-column h-100">
                                <div class="chat-header border-bottom p-3">
                                    <h4 id="current-chat-name" class="m-0">Select a conversation</h4>
                                </div>
                                <div class="messages flex-grow-1 p-3">
                                    <!-- Messages populated by JavaScript -->
                                </div>
                                <div class="message-input border-top p-3">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="message-text" placeholder="Type a message...">
                                        <button class="btn btn-primary" id="send-message">
                                            <i class="fas fa-paper-plane me-1"></i> Send
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/messages.js"></script>
</body>
</html>
